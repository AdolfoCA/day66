const roundTo=(v,step)=>Math.round(v/step)*step;
function weekOf(n){return Math.max(1,Math.ceil(n/7))}
function plannedKg(lift,n){const w=weekOf(n);const ramp=w<=4?w:w===5?4:Math.min(8,w-1);let v=lift.kg+(lift.wk||0)*(ramp-1);
 if(w===5)v*=0.8;if(n>63)v*=0.7;return roundTo(v,lift.each?1:2.5)}
function targetKg(lift,k,type){
 const n=dayNum(k),planned=plannedKg(lift,n);
 const prev=Object.values(S.sessions).filter(s=>s.type===type&&s.date<k&&s.sets&&s.sets[lift.n]&&s.sets[lift.n].length).sort((a,b)=>a.date<b.date?1:-1)[0];
 if(!prev||lift.bw&&!lift.wk)return planned;

function plannedLifts(k){

function metrics(){

 dates.forEach(k=>{if(dayNum(k)<1||k>t)return;const tt=totals(k);if(mealsOn(k).length>=3){fed++;deficit+=(S.settings.maintenance||2600)-tt.kcal}if(tt.p>=T.protein)protDays++});
 const done=Object.values(S.sessions).filter(s=>s.status==='done'||s.status==='short');

}

function ring66(size){
 const n=dayNum(todayKey());const R=size/2,r=R-10,segs=[];
 for(let i=1;i<=TOTAL;i++){const a0=-Math.PI/2+(i-1)/TOTAL*2*Math.PI+0.012,a1=-Math.PI/2+i/TOTAL*2*Math.PI-0.012;
  const x0=R+r*Math.cos(a0),y0=R+r*Math.sin(a0),x1=R+r*Math.cos(a1),y1=R+r*Math.sin(a1);
  const d=S.days[dateOfDay(i)];const y=d?yesCount(d):0;
  let col='var(--line2)',w=5,op=1;
  if(i<n||(i===n&&d&&d.closed)){if(y>=4){col='var(--gold)'}else if(y>=1){col='var(--gold)';op=.4}else{col='var(--line)'}}
  else if(i===n){col='var(--lume)';w=6}

  segs.push(`<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" stroke="${col}" stroke-width="${w}" fill="none" stroke-linecap="butt" opacity="${op}"/>`)}

}

 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight, 7-day average"><line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="var(--line2)"/><text x="${P}" y="${P-10}" fill="var(--mute)" font-size="11">${hi.toFixed(1)} kg</text><text x="${P}" y="${H-P+16}" fill="var(--mute)" font-size="11">${lo.toFixed(1)} kg</text><text x="${W-P}" y="${H-P+16}" fill="var(--mute)" font-size="11" text-anchor="end">${fmt(pts[pts.length-1].date)}</text>${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.w)}" r="2.5" fill="var(--mute)" opacity=".6"/>`).join('')}<path d="${line}" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linejoin="round"/><text x="${x(pts.length-1)}" y="${y(pts[pts.length-1].a)-10}" fill="var(--lume)" font-size="12" text-anchor="end">${pts[pts.length-1].a.toFixed(1)}</text></svg>`;
}

/* ========= Actions ========= */
document.addEventListener('click',async e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 const act=el.dataset.act;
 if(act==='overlay'){if(e.target===el){S.sheet=null;render()}return}
 e.stopPropagation();
 if(act==='go'){go(el.dataset.to);return}
 if(act.startsWith('toggle:')){const f=act.slice(7),t=todayKey(),d=getDay(t);let v;if(f==='noAlcohol'||f==='slept')v=d[f]===true?false:true;else v=!d[f];await saveDay(t,{[f]:v});render();return}
 if(act.startsWith('form:')){const f=act.slice(5);const v=el.dataset.v!==undefined?el.dataset.v:!S.sheet.form[f];S.sheet.form[f]=v;render();return}
 if(act==='sheet:checkin'){const t=todayKey(),d=getDay(t),med=S.meditations[t],s=sessionFor(t);S.sheet={type:'checkin',form:{trained:d.trained||s.status==='done'||s.status==='short',ate:d.ate,noAlcohol:d.noAlcohol!==false,meditated:d.meditated||!!(med&&med.done),slept:d.slept!==false,weight:d.weight,waist:d.waist,sessionTime:getDay(addDays(t,1)).sessionTime||'',note:d.note}};render();return}
 if(act==='save-checkin'){const t=todayKey(),f=S.sheet.form;S.sheet=null;await saveDay(t,{trained:!!f.trained,ate:!!f.ate,noAlcohol:!!f.noAlcohol,meditated:!!f.meditated,slept:!!f.slept,weight:f.weight?+f.weight:null,waist:f.waist?+f.waist:null,note:f.note||'',closed:true});if(f.sessionTime)await saveDay(addDays(t,1),{sessionTime:f.sessionTime});render();return}
 if(act==='close-sheet'){S.sheet=null;render();return}
 if(act==='open-session'){S.sessionDate=el.dataset.date;S.short=false;S.view='session';location.hash='#session';render();return}
 if(act==='short-toggle'){S.short=!S.short;render();return}
 if(act==='sheet:logset'){const s=sessionFor(S.sessionDate);const n=((s.sets&&s.sets[el.dataset.lift])||[]).length+1;const prev=(s.sets&&s.sets[el.dataset.lift]||[]).slice(-1)[0];S.sheet={type:'logset',lift:el.dataset.lift,setNo:n,form:{kg:prev?prev.kg:el.dataset.kg,reps:prev?prev.reps:el.dataset.reps,rir:1}};render();return}
 if(act==='save-set'){const k=S.sessionDate,s=Object.assign({},sessionFor(k));s.sets=Object.assign({},s.sets||{});const arr=(s.sets[S.sheet.lift]||[]).slice();arr.push({kg:+S.sheet.form.kg||0,reps:+S.sheet.form.reps||0,rir:S.sheet.form.rir===''?null:+S.sheet.form.rir});s.sets[S.sheet.lift]=arr;S.sessions[k]=s;S.sheet=null;render();await store.set('sessions/'+k,s);return}
 if(act==='done-session'){const k=el.dataset.date,s=Object.assign({},sessionFor(k));const short=S.short;s.status=short?'short':'done';s.short=!!short;s.minutes=short?20:(SESSIONS[s.type].cardio?(SESSIONS[s.type].cardio.min+SESSIONS[s.type].flowMin+5):45);s.doneAt=fromMin(nowMin());S.sessions[k]=s;render();await store.set('sessions/'+k,s);await saveDay(k,{trained:true});render();return}
 if(act==='water'){const t=todayKey();await saveDay(t,{water:getDay(t).water+(+el.dataset.ml)});render();return}
 if(act==='sheet:planned'){const h=new Date().getHours();const slot=h<10?'breakfast':h<12?'snack1':h<14?'lunch':h<17?'snack2':'dinner';S.sheet={type:'planned',form:{slot,dish:(slot==='breakfast'?BREAKFASTS:slot==='dinner'?DINNERS:SNACKS)[0].id,grams:''}};render();return}
 if(act==='save-planned'){const f=S.sheet.form;const list=BREAKFASTS.concat(SNACKS,DINNERS);const sel=list.find(x=>x.id===f.dish);if(!sel)return;const scale=f.grams?+f.grams/sel.g:1;await addMeal({slot:f.slot,dish:sel.n,description:sel.n,grams:f.grams?+f.grams:sel.g,kcal:Math.round(sel.kcal*scale),p:r1(sel.p*scale),f:r1(sel.f*scale),c:r1(sel.c*scale),fi:r1(sel.fi*scale),source:'plan'});S.sheet=null;render();return}
 if(act==='sheet:manual'){const h=new Date().getHours();const slot=h<10?'breakfast':h<12?'snack1':h<14?'lunch':h<17?'snack2':'dinner';S.sheet={type:'manual',form:{slot}};render();return}
 if(act==='save-manual'){const f=S.sheet.form;if(!f.kcal&&!f.p){return}await addMeal({slot:f.slot,description:f.description||'Meal',grams:f.grams?+f.grams:null,kcal:Math.round(+f.kcal||0),p:r1(+f.p||0),f:r1(+f.f||0),c:r1(+f.c||0),fi:r1(+f.fi||0),source:f.thumb?'photo':'manual',thumb:f.thumb||null,ai:f.ai||null});S.sheet=null;render();return}
 if(act==='reanalyse'){const f=S.sheet.form;if(f.blob){await analysePhoto(f.blob,f.thumb,f.slot,f.grams)}return}
 if(act==='del-meal'){const id=el.dataset.id;S.meals=S.meals.filter(m=>m._id!==id);render();await store.del('meals/'+id);return}
 if(act==='start-timer'){startTimer();return}
 if(act==='stop-timer'){clearInterval(timerI);try{speechSynthesis.cancel()}catch(e){}S.view='scene';render();return}
 if(act==='toggle-voice'){S.settings.voice=S.settings.voice===false;await store.set('settings/main',S.settings);render();return}
 if(act==='finish-timer'){await finishMeditation();return}
 if(act==='sheet:ownscene'){const sc=sceneFor(todayKey());S.sheet={type:'ownscene',form:{kind:sc.kind,text:(S.meditations[todayKey()]&&S.meditations[todayKey()].own)?sc.text:''}};render();return}
 if(act==='save-ownscene'){const f=S.sheet.form,k=todayKey();if(!f.text||!f.text.trim())return;const m=Object.assign({},S.meditations[k]||{},{date:k,kind:f.kind,scene:f.text.trim(),own:true,done:!!(S.meditations[k]&&S.meditations[k].done)});S.meditations[k]=m;S.sheet=null;render();await store.set('meditations/'+k,m);return}

 if(act==='del-sentence'){const id=el.dataset.id;S.sentences=S.sentences.filter(x=>x._id!==id);render();await store.del('sentences/'+id);return}
 if(act==='sheet:data'){S.copied=false;S.sheet={type:'data',form:{}};render();return}

 if(act==='save-settings'){const s=S.settings;document.querySelectorAll('[data-field^="target:"],[data-field^="setting:"],[data-field^="reward:"]').forEach(inp=>{const [kind,key]=inp.dataset.field.split(':');const v=inp.type==='number'?(+inp.value||0):inp.value;if(kind==='target')s.targets[key]=v;else if(kind==='reward')s.rewards[key]=v;else s[key]=v});await store.set('settings/main',s);S.savedNote='Saved.';render();setTimeout(()=>{S.savedNote='';},2000);return}
});
document.addEventListener('change',async e=>{
 const el=e.target.closest('[data-field]');if(!el)return;const f=el.dataset.field;
 if(f==='photo'){const file=el.files&&el.files[0];if(file)await onPhoto(file);return}
 if(f.startsWith('form:')&&S.sheet){S.sheet.form[f.slice(5)]=el.value;if(f==='form:dish'||f==='form:grams')render();return}
});
document.addEventListener('input',e=>{const el=e.target.closest('[data-field^="form:"]');if(el&&S.sheet&&el.type!=='time'){S.sheet.form[el.dataset.field.slice(5)]=el.value}});
function exportData(){return JSON.stringify({app:'day66',exported:new Date().toISOString(),settings:S.settings,days:S.days,sessions:S.sessions,meals:S.meals,meditations:S.meditations,sentences:S.sentences})}
async function importData(d){if(!d||d.app!=='day66')throw new Error('format');
 if(d.settings){S.settings=mergeSettings(d.settings);await store.set('settings/main',S.settings)}
 for(const k of Object.keys(d.days||{})){S.days[k]=d.days[k];await store.set('days/'+k,d.days[k])}
 for(const k of Object.keys(d.sessions||{})){S.sessions[k]=d.sessions[k];await store.set('sessions/'+k,d.sessions[k])}
 for(const k of Object.keys(d.meditations||{})){S.meditations[k]=d.meditations[k];await store.set('meditations/'+k,d.meditations[k])}
 for(const m of (d.meals||[])){if(!S.meals.some(x=>x._id===m._id)){S.meals.push(m);const row=Object.assign({},m);delete row._id;await store.set('meals/'+m._id,row)}}
 for(const x of (d.sentences||[])){if(!S.sentences.some(y=>y._id===x._id)){S.sentences.push(x);const row=Object.assign({},x);delete row._id;await store.set('sentences/'+x._id,row)}}
 S.meals.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0))}
async function addMeal(m){const id=uid();const row=Object.assign({date:todayKey(),createdAt:Date.now()},m);S.meals.push(Object.assign({_id:id},row));await store.set('meals/'+id,row)}
function go(v){S.sheet=null;S.view=v;if(v!=='session')location.hash='#'+(v==='settings'?'yours':v);render()}
window.addEventListener('hashchange',()=>{let h=location.hash.slice(1);if(h==='yours')h='settings';if(['start','today','train','eat','scene','mirror','settings'].includes(h)&&h!==S.view){S.view=h;render()}});

/* ========= Photos ========= */
function loadImage(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{URL.revokeObjectURL(url);res(img)};img.onerror=rej;img.src=url})}
function drawTo(img,max,q){const c=document.createElement('canvas');const r=Math.min(1,max/Math.max(img.width,img.height));c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return new Promise(res=>c.toBlob(b=>res({blob:b,dataUrl:c.toDataURL('image/jpeg',q)}),'image/jpeg',q))}
async function onPhoto(file){
 S.busy='photo';render();
 try{const img=await loadImage(file);const big=await drawTo(img,1024,.82);const small=await drawTo(img,96,.7);
  const h=new Date().getHours();const slot=h<10?'breakfast':h<12?'snack1':h<14?'lunch':h<17?'snack2':'dinner';
  S.sheet={type:'manual',form:{slot,thumb:small.dataUrl,blob:big.blob,aiNote:sampleFn&&sampleImages?'Estimating from the photo':'Type the numbers; photo analysis is not available in this view.'}};
  S.busy='';render();
  if(sampleFn&&sampleImages)await analysePhoto(big.blob,small.dataUrl,slot,'');
 }catch(e){S.busy='';render()}
}
async function analysePhoto(blob,thumb,slot,grams){
 if(!S.sheet||S.sheet.type!=='manual')return;S.sheet.form.aiNote='Estimating from the photo';render();
 try{const slotName=SLOTS.find(x=>x[0]===slot)?.[1]||slot;
  const prompt=`You estimate nutrition for Adolfo's personal app Day 66. He is a 28-year-old man, 1.74 m, 80 kg, eating about 2200 kcal and 160 g protein a day, fish and vegetables, no meat except what is on the plate. This photo is his ${slotName}${grams?`, and the plate weighed ${grams} g in total (scale the estimate to that weight)`:''}. His planned meals, if this looks like one of them: shake with milk, whey, banana and oats (450 kcal, 40 g protein); breakfast burrito with beans and two eggs (450 kcal, 28 g); skyr 200 g (200 kcal, 20 g); DTU canteen vegetarian plate paid by weight; dinners: bean and rice burritos, pasta with courgette and prawns, pasta al pomodoro with beans and parmesan, salmon bowl with quinoa, red lentil stew, big salad with eggs, chickpeas and tuna. Identify the foods and portion sizes, then estimate totals. Be realistic about oil and sauces. Return JSON only: {"description": "short name of the meal, max 8 words", "grams": estimated total grams as a number, "kcal": number, "protein_g": number, "fat_g": number, "carb_g": number, "fibre_g": number, "confidence": "low"|"medium"|"high", "tip": "one plain sentence in British spelling, no exclamation marks, no em dashes, about this plate against his targets"}`;
  const r=await sampleFn.json(prompt,{images:[blob],modelTier:'default'});
  if(S.sheet&&S.sheet.type==='manual'){const f=S.sheet.form;f.description=r.description||f.description;f.grams=grams||r.grams||f.grams;f.kcal=Math.round(+r.kcal||0);f.p=r1(+r.protein_g||0);f.f=r1(+r.fat_g||0);f.c=r1(+r.carb_g||0);f.fi=r1(+r.fibre_g||0);f.ai={confidence:r.confidence,tip:r.tip};f.aiNote=`${r.confidence?r.confidence[0].toUpperCase()+r.confidence.slice(1)+' confidence. ':''}${r.tip||''} Edit anything that looks wrong.`;render()}
 }catch(e){if(S.sheet&&S.sheet.type==='manual'){S.sheet.form.aiNote=e&&e.code==='not_granted'?'Photo analysis was not allowed here. Type the numbers instead.':'The estimate did not come through. Type the numbers, or try again.';render()}}
}

/* ========= Boot ========= */
(function(){let h=location.hash.slice(1);if(h==='yours')h='settings';S.view=['today','train','eat','scene','mirror','settings'].includes(h)?h:'start';render();load()})();
</script>
